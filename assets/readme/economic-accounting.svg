<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="450" viewBox="0 0 1320 450" role="img" aria-labelledby="t d"><title id="t">Portfolio cash-flow integrity</title><desc id="d">A defensible future simulator separates market PNL, correctly converted carry, transaction costs and external deposits before net asset value. The existing simulator does not satisfy the full accounting invariants.</desc><rect width="1320" height="450" rx="15" fill="#0d1726"/><text x="40" y="52" fill="#eff5fc" font-size="25" font-family="Arial,sans-serif" font-weight="700">CASH-FLOW ACCOUNTING / PROPOSED VALIDATION TARGET</text><g font-family="Arial,sans-serif"><rect x="44" y="107" width="279" height="76" rx="10" fill="#162f42" stroke="#5dcfb7"/><text x="63" y="140" fill="#fff" font-size="19">Price PnL</text><text x="63" y="162" fill="#9ec1d1" font-size="14">Directional mark-to-market</text><rect x="352" y="107" width="279" height="76" rx="10" fill="#162f42" stroke="#5dcfb7"/><text x="371" y="140" fill="#fff" font-size="19">Carry PnL</text><text x="371" y="162" fill="#9ec1d1" font-size="14">Historical broker financing</text><rect x="660" y="107" width="279" height="76" rx="10" fill="#162f42" stroke="#e5ab83"/><text x="679" y="140" fill="#fff" font-size="19">Trading costs</text><text x="679" y="162" fill="#ddc6b8" font-size="14">Spread, fee, slippage</text><rect x="968" y="107" width="303" height="76" rx="10" fill="#162f42" stroke="#5dcfb7"/><text x="987" y="140" fill="#fff" font-size="19">External cash flow</text><text x="987" y="162" fill="#9ec1d1" font-size="14">Deposits / withdrawals only</text><path d="M183 183v56h465M492 183v56M800 183v56H648M1120 183v56H648M648 239v36" stroke="#7bbac2" stroke-width="2" fill="none"/><rect x="385" y="275" width="530" height="75" rx="10" fill="#17413e" stroke="#6ee5c1"/><text x="410" y="306" fill="#fff" font-size="20" font-weight="700">NAV(t+1) = NAV(t) + all signed flows</text><text x="410" y="330" fill="#a9e0d3" font-size="15">No profit duplication; deposits are not returns</text><text x="43" y="401" fill="#e9b887" font-size="16">STATUS: TARGET MODEL, NOT THE VERIFIED BEHAVIOR OF CURRENT SOURCE</text></g></svg>