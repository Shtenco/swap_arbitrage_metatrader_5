<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="330" viewBox="0 0 1320 330" role="img" aria-labelledby="t d"><title id="t">Research verification gates</title><desc id="d">Chronological data, causal features and historical financing, aligned portfolio accounting, frozen out-of-sample test, costs and confidence intervals.</desc><rect width="1320" height="330" rx="16" fill="#0d1828"/><text x="42" y="51" font-size="25" font-family="Arial,sans-serif" fill="#edf5fa" font-weight="700">RESEARCH ACCEPTANCE GATES</text><g font-family="Arial,sans-serif"><rect x="35" y="115" width="232" height="86" rx="11" stroke="#c8a274" fill="#182d40"/><text x="52" y="148" fill="#6bdbca" font-size="14">01</text><text x="52" y="176" fill="#e8f0f5" font-size="14" font-weight="700">POINT-IN-TIME DATA</text><path d="M267 158h26" stroke="#6cd5bf" stroke-width="2"/><rect x="293" y="115" width="232" height="86" rx="11" stroke="#62cdbb" fill="#182d40"/><text x="310" y="148" fill="#6bdbca" font-size="14">02</text><text x="310" y="176" fill="#e8f0f5" font-size="14" font-weight="700">CAUSAL ALLOCATION</text><path d="M525 158h26" stroke="#6cd5bf" stroke-width="2"/><rect x="551" y="115" width="232" height="86" rx="11" stroke="#62cdbb" fill="#182d40"/><text x="568" y="148" fill="#6bdbca" font-size="14">03</text><text x="568" y="176" fill="#e8f0f5" font-size="14" font-weight="700">COSTED BOOKKEEPING</text><path d="M783 158h26" stroke="#6cd5bf" stroke-width="2"/><rect x="809" y="115" width="232" height="86" rx="11" stroke="#62cdbb" fill="#182d40"/><text x="826" y="148" fill="#6bdbca" font-size="14">04</text><text x="826" y="176" fill="#e8f0f5" font-size="14" font-weight="700">FROZEN WALK-FORWARD</text><path d="M1041 158h26" stroke="#6cd5bf" stroke-width="2"/><rect x="1067" y="115" width="232" height="86" rx="11" stroke="#62cdbb" fill="#182d40"/><text x="1084" y="148" fill="#6bdbca" font-size="14">05</text><text x="1084" y="176" fill="#e8f0f5" font-size="14" font-weight="700">REPRODUCIBLE REPORT</text><text x="40" y="258" fill="#b7c6d3" font-size="15">All gates must be independently evidenced before any investment-performance claim.</text><text x="40" y="282" fill="#e3ae84" font-size="15">No backtest output, official benchmark or live profit is asserted by this diagram.</text></g></svg>